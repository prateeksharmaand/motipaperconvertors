name: motipaper
description: MotiPaper — Job management for printing presses
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.4

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Local storage
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # Notifications
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3

  # QR code
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # UI
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
