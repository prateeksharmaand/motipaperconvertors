# ── api.motipaper.in ──────────────────────────────────────
server {
  listen 80;
  server_name api.motipaper.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name api.motipaper.in;

  ssl_certificate /etc/letsencrypt/live/api.motipaper.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.motipaper.in/privkey.pem;

  location / {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ── admin.motipaper.in ────────────────────────────────────
server {
  listen 80;
  server_name admin.motipaper.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name admin.motipaper.in;

  ssl_certificate /etc/letsencrypt/live/admin.motipaper.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.motipaper.in/privkey.pem;

  location / {
    proxy_pass http://admin-panel:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ── motipaper.in (marketing site) ────────────────────────
server {
  listen 80;
  server_name motipaper.in www.motipaper.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://motipaper.in$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name motipaper.in www.motipaper.in;

  ssl_certificate /etc/letsencrypt/live/motipaper.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/motipaper.in/privkey.pem;

  root /usr/share/nginx/html/marketing;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
