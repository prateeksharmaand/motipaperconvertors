# ── motipaperconvertors.com (marketing site) ─────────────
server {
  listen 80;
  server_name motipaperconvertors.com www.motipaperconvertors.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://motipaperconvertors.com$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name motipaperconvertors.com www.motipaperconvertors.com;

  ssl_certificate /etc/letsencrypt/live/motipaperconvertors.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/motipaperconvertors.com/privkey.pem;

  root /usr/share/nginx/html/marketing;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ── api.motipaperconvertors.com ───────────────────────────
server {
  listen 80;
  server_name api.motipaperconvertors.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name api.motipaperconvertors.com;

  ssl_certificate /etc/letsencrypt/live/motipaperconvertors.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/motipaperconvertors.com/privkey.pem;

  location / {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ── admin.motipaperconvertors.com ─────────────────────────
server {
  listen 80;
  server_name admin.motipaperconvertors.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name admin.motipaperconvertors.com;

  ssl_certificate /etc/letsencrypt/live/motipaperconvertors.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/motipaperconvertors.com/privkey.pem;

  location /api/v1/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://admin-panel:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
